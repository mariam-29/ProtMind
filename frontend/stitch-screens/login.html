<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - ProtMind</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&amp;family=JetBrains+Mono:wght@400&amp;family=Sora:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "outline-variant": "#bcc9c6",
                      "surface": "#f4faff",
                      "surface-container-low": "#e7f6ff",
                      "on-primary-container": "#f4fffb",
                      "error": "#ba1a1a",
                      "surface-tint": "#006b60",
                      "outline": "#6d7a77",
                      "on-tertiary-container": "#f3fffe",
                      "on-tertiary-fixed": "#002020",
                      "on-primary-fixed": "#00201c",
                      "on-secondary-fixed-variant": "#004d67",
                      "tertiary-fixed": "#c2eaea",
                      "inverse-surface": "#153441",
                      "on-secondary": "#ffffff",
                      "inverse-on-surface": "#e1f4ff",
                      "primary-fixed-dim": "#67d9c8",
                      "on-primary-fixed-variant": "#005048",
                      "on-error-container": "#93000a",
                      "primary": "#00685d",
                      "on-primary": "#ffffff",
                      "on-surface": "#001f2a",
                      "tertiary": "#3d6263",
                      "on-background": "#001f2a",
                      "secondary": "#1d6584",
                      "surface-variant": "#c8e7f8",
                      "tertiary-container": "#567b7b",
                      "secondary-fixed-dim": "#90cff1",
                      "on-tertiary": "#ffffff",
                      "on-error": "#ffffff",
                      "on-secondary-container": "#16607f",
                      "on-tertiary-fixed-variant": "#274d4d",
                      "surface-container-lowest": "#ffffff",
                      "primary-container": "#008376",
                      "surface-container-high": "#ceedfe",
                      "on-secondary-fixed": "#001e2b",
                      "inverse-primary": "#67d9c8",
                      "background": "#f4faff",
                      "surface-bright": "#f4faff",
                      "error-container": "#ffdad6",
                      "surface-dim": "#c0dff0",
                      "surface-container-highest": "#c8e7f8",
                      "secondary-container": "#9bdafd",
                      "primary-fixed": "#85f6e4",
                      "tertiary-fixed-dim": "#a7cece",
                      "secondary-fixed": "#c2e8ff",
                      "on-surface-variant": "#3d4947",
                      "surface-container": "#daf1ff"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-lg": "32px",
                      "stack-sm": "8px",
                      "container-padding": "24px",
                      "stack-md": "16px",
                      "grid-gutter": "16px",
                      "base": "4px"
              },
              "fontFamily": {
                      "body": [
                              "DM Sans"
                      ],
                      "label": [
                              "DM Sans"
                      ],
                      "h1": [
                              "Sora"
                      ],
                      "h2": [
                              "Sora"
                      ],
                      "mono": [
                              "JetBrains Mono"
                      ],
                      "h3": [
                              "Sora"
                      ]
              },
              "fontSize": {
                      "body": [
                              "15px",
                              {
                                      "lineHeight": "1.6",
                                      "fontWeight": "400"
                              }
                      ],
                      "label": [
                              "13px",
                              {
                                      "lineHeight": "1.0",
                                      "fontWeight": "500"
                              }
                      ],
                      "h1": [
                              "32px",
                              {
                                      "lineHeight": "1.2",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "600"
                              }
                      ],
                      "h2": [
                              "24px",
                              {
                                      "lineHeight": "1.3",
                                      "fontWeight": "600"
                              }
                      ],
                      "mono": [
                              "13px",
                              {
                                      "lineHeight": "1.5",
                                      "fontWeight": "400"
                              }
                      ],
                      "h3": [
                              "18px",
                              {
                                      "lineHeight": "1.4",
                                      "fontWeight": "500"
                              }
                      ]
              }
      },
          },
        }
    </script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-container-padding font-body text-on-surface antialiased">
<!-- TopNavBar (Suppressed for Linear/Transactional Login intent, keeping Footer suppressed as well to maintain focus) -->
<main class="w-full max-w-[440px] z-10">
<!-- Logo Header -->
<div class="text-center mb-stack-lg">
<h1 class="font-h1 text-h1 text-primary flex items-center justify-center gap-stack-sm mb-stack-sm">
<span class="material-symbols-outlined text-[32px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">biotech</span>
                ProtMind
            </h1>
<p class="font-body text-body text-on-surface-variant">Clinical Informatics Workspace</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-stack-lg shadow-[0_2px_12px_rgba(13,92,122,0.08)] border border-surface-container-highest">
<h2 class="font-h2 text-h2 text-on-surface mb-stack-md text-center">Secure Access</h2>
<div class="h-px w-full bg-tertiary-container opacity-20 mb-stack-lg"></div>
<form action="#" class="space-y-stack-md" method="POST">
<!-- Email Field -->
<div class="flex flex-col gap-stack-sm">
<label class="font-label text-label text-on-surface-variant" for="email">Professional Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[18px]">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg font-body text-body text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow" id="email" name="email" placeholder="dr.smith@institution.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-stack-sm">
<div class="flex justify-between items-center">
<label class="font-label text-label text-on-surface-variant" for="password">Password</label>
<a class="font-label text-label text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline text-[18px]">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-2 bg-surface-container-lowest border border-outline-variant rounded-lg font-body text-body text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-shadow" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-outline hover:text-on-surface transition-colors">
<span class="material-symbols-outlined text-[18px]">visibility_off</span>
</div>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center pt-stack-sm">
<input class="h-4 w-4 rounded border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface-container-lowest bg-surface-container-lowest" id="remember" name="remember" type="checkbox"/>
<label class="ml-2 block font-body text-body text-on-surface-variant" for="remember">
                        Remember me for 30 days
                    </label>
</div>
<!-- Primary CTA -->
<div class="pt-stack-md">
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm font-label text-label text-on-primary bg-primary hover:bg-on-primary-fixed-variant focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors duration-150" type="submit">
                        Login to Workspace
                    </button>
</div>
</form>
<!-- Secondary Action -->
<div class="mt-stack-lg text-center border-t border-surface-container-highest pt-stack-md">
<p class="font-body text-body text-on-surface-variant">
                    Don't have an account? 
                    <a class="font-label text-label text-primary hover:text-primary-container transition-colors" href="#">Sign Up</a>
</p>
</div>
</div>
<!-- Footer Note -->
<div class="mt-stack-lg text-center">
<p class="font-mono text-mono text-outline text-[11px]">
                Protected by Clinical-Grade Encryption • V 2.4.1
            </p>
</div>
</main>
</body></html>
