<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>ProtMind — Unified Intelligent Bioinformatics Platform</title>
    <meta name="description" content="ProtMind: Precision informatics for deep genomic and proteomic metadata analysis. Search proteins, visualize 3D structures, and predict functions with AI."/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-lowest": "#ffffff",
                        "on-secondary-fixed": "#001e2b",
                        "inverse-primary": "#67d9c8",
                        "surface-container-low": "#e7f6ff",
                        "surface-container": "#daf1ff",
                        "error-container": "#ffdad6",
                        "on-primary": "#ffffff",
                        "surface-dim": "#c0dff0",
                        "inverse-on-surface": "#e1f4ff",
                        "tertiary": "#3d6263",
                        "on-tertiary-fixed-variant": "#274d4d",
                        "on-primary-fixed": "#00201c",
                        "background": "#f4faff",
                        "tertiary-fixed": "#c2eaea",
                        "error": "#ba1a1a",
                        "outline": "#6d7a77",
                        "primary-container": "#008376",
                        "secondary": "#1d6584",
                        "surface-variant": "#c8e7f8",
                        "on-primary-fixed-variant": "#005048",
                        "secondary-fixed-dim": "#90cff1",
                        "primary-fixed-dim": "#67d9c8",
                        "surface-container-high": "#ceedfe",
                        "on-primary-container": "#f4fffb",
                        "surface-bright": "#f4faff",
                        "on-secondary-container": "#16607f",
                        "secondary-fixed": "#c2e8ff",
                        "surface-container-highest": "#c8e7f8",
                        "on-tertiary": "#ffffff",
                        "primary": "#00685d",
                        "on-error": "#ffffff",
                        "on-secondary-fixed-variant": "#004d67",
                        "on-background": "#001f2a",
                        "on-tertiary-container": "#f3fffe",
                        "inverse-surface": "#153441",
                        "on-surface-variant": "#3d4947",
                        "on-tertiary-fixed": "#002020",
                        "tertiary-container": "#567b7b",
                        "primary-fixed": "#85f6e4",
                        "on-surface": "#001f2a",
                        "surface-tint": "#006b60",
                        "outline-variant": "#bcc9c6",
                        "on-secondary": "#ffffff",
                        "surface": "#f4faff",
                        "on-error-container": "#93000a",
                        "secondary-container": "#9bdafd",
                        "tertiary-fixed-dim": "#a7cece",
                        "secondary-fixed": "#c2e8ff"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        "stack-md": "16px",
                        "grid-gutter": "16px",
                        "base": "4px",
                        "stack-sm": "8px",
                        "container-padding": "24px",
                        "stack-lg": "32px"
                    },
                    fontFamily: {
                        h1: ["Sora"],
                        mono: ["JetBrains Mono"],
                        label: ["DM Sans"],
                        body: ["DM Sans"],
                        h3: ["Sora"],
                        h2: ["Sora"]
                    },
                    fontSize: {
                        h1: ["32px", { lineHeight: "1.2", letterSpacing: "-0.02em", fontWeight: "600" }],
                        mono: ["13px", { lineHeight: "1.5", fontWeight: "400" }],
                        label: ["13px", { lineHeight: "1.0", fontWeight: "500" }],
                        body: ["15px", { lineHeight: "1.6", fontWeight: "400" }],
                        h3: ["18px", { lineHeight: "1.4", fontWeight: "500" }],
                        h2: ["24px", { lineHeight: "1.3", fontWeight: "600" }]
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="styles.css"/>
</head>
<body class="bg-background text-on-background min-h-screen font-body text-body antialiased">

    <!-- ==================== AUTH PAGES (Login / SignUp) ==================== -->
    <div id="auth-container" class="hidden min-h-screen flex items-center justify-center p-container-padding"></div>

    <!-- ==================== APP SHELL ==================== -->
    <div id="app-shell" class="hidden min-h-screen flex">
        <!-- SideNavBar -->
        <nav id="sidebar" class="fixed left-0 top-0 h-screen w-[240px] border-r border-slate-800 bg-[#0D1F23] flex flex-col py-6 z-50 transition-transform duration-300">
            <div class="px-6 mb-8 flex items-center gap-3">
                <div class="w-9 h-9 rounded-lg bg-teal-500/20 flex items-center justify-center">
                    <span class="material-symbols-outlined text-teal-400" style="font-variation-settings:'FILL' 1;">biotech</span>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight text-white">ProtMind</h1>
                    <p class="text-teal-500 text-[11px] uppercase tracking-wider">Clinical Informatics</p>
                </div>
            </div>
            <div class="flex-1 flex flex-col gap-1 px-4" id="nav-links">
                <!-- Nav links injected by JS -->
            </div>
            <div class="px-4 mt-auto pt-4 border-t border-slate-800">
                <a href="#" onclick="navigate('login'); return false;" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-400 hover:text-red-400 hover:bg-white/5 transition-all duration-150 text-sm">
                    <span class="material-symbols-outlined">logout</span>
                    <span>Sign Out</span>
                </a>
            </div>
        </nav>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col ml-[240px] min-h-screen">
            <!-- TopAppBar -->
            <header id="topbar" class="sticky top-0 h-14 border-b border-teal-100 bg-[#F0FAFA] flex justify-between items-center px-8 z-40">
                <div class="flex items-center gap-6">
                    <span class="text-sm font-black text-slate-900 uppercase tracking-widest font-sans">Research Workspace</span>
                    <nav class="hidden md:flex items-center gap-4">
                        <a class="font-sans text-sm font-medium text-[#1A9E8F] font-bold cursor-pointer" href="#">Overview</a>
                        <a class="font-sans text-sm font-medium text-slate-500 hover:text-[#1A9E8F] cursor-pointer" href="#">History</a>
                        <a class="font-sans text-sm font-medium text-slate-500 hover:text-[#1A9E8F] cursor-pointer" href="#">Protocols</a>
                    </nav>
                </div>
                <div class="flex items-center gap-4">
                    <button class="font-sans text-sm font-medium text-primary hover:bg-surface-container rounded-md px-3 py-1.5 transition-colors border border-primary">Export</button>
                    <div class="flex items-center gap-2 text-[#1A9E8F]">
                        <button class="p-1 rounded-full hover:bg-surface-container transition-colors"><span class="material-symbols-outlined">notifications</span></button>
                        <button class="p-1 rounded-full hover:bg-surface-container transition-colors"><span class="material-symbols-outlined">settings</span></button>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-bold text-sm ml-2">U</div>
                </div>
            </header>

            <!-- Page Content -->
            <main id="page-content" class="flex-1 p-container-padding overflow-y-auto"></main>
        </div>
    </div>

    <script src="pages/landing.js"></script>
    <script src="pages/login.js"></script>
    <script src="pages/signup.js"></script>
    <script src="pages/search.js"></script>
    <script src="pages/protein.js"></script>
    <script src="pages/viewer.js"></script>
    <script src="pages/predictions.js"></script>
    <script src="pages/clinical.js"></script>
    <script src="app.js"></script>
</body>
</html>
